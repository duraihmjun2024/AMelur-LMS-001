<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AMelur-LMS-001 • PUPS Anjalam Melur</title>
  <style>
    :root {
      --bg: #0b1120;
      --panel: #111827;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #0ea5e9;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow-x: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      padding: 6px;
      gap: 6px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .badge {
      background: var(--accent);
      color: #031525;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.8rem;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .fs-btn {
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 9px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      letter-spacing: 0.5px;
    }
    .fs-btn:hover { border-color: var(--accent); color: var(--accent); }

    .main-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .login-card {
      width: 100%;
      max-width: 520px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    }
    .school-title {
      text-align: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .school-title h1 {
      font-size: 1.1rem;
      color: #38bdf8;
      margin-bottom: 2px;
    }
    .school-title p {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field.full { grid-column: 1 / -1; }
    label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #cbd5e1;
    }
    input, select {
      width: 100%;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.92rem;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 2px;
    }
    .game-btn {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      border: 1px solid #38bdf8;
      border-radius: 10px;
      padding: 10px 8px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .game-btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .game-btn.secondary {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border-color: var(--border);
      color: #e2e8f0;
    }
    .game-btn small {
      font-size: 0.72rem;
      font-weight: 500;
      opacity: 0.9;
    }
    .status-box {
      display: none;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      text-align: center;
    }
    .status-box.error {
      display: block;
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid var(--red);
      color: #fca5a5;
    }
    .status-box.info {
      display: block;
      background: rgba(14, 165, 233, 0.16);
      border: 1px solid var(--accent);
      color: #7dd3fc;
    }
    @media (max-width: 480px) {
      .form-grid, .game-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="badge">AMelur-LMS-001</span>
      <span>PUPS, Anjalam Melur</span>
    </div>
    <div class="top-actions">
      <button type="button" id="fsToggleBtn" class="fs-btn" title="Toggle Fullscreen">[ ]</button>
    </div>
  </header>

  <main class="main-wrap">
    <section class="login-card">
      <div class="school-title">
        <h1>Welcome to PUPS, Anjalam Melur</h1>
        <p>Tamil Nadu, India • Student Learning Portal</p>
      </div>

      <div class="form-grid">
        <div class="field">
          <label for="emisInput">Student EMIS ID</label>
          <input type="text" id="emisInput" inputmode="numeric" maxlength="15" placeholder="Enter EMIS ID" autocomplete="off" />
        </div>
        <div class="field">
          <label for="classSelect">Class</label>
          <select id="classSelect">
            <option value="5">Class 5</option>
            <option value="4">Class 4</option>
            <option value="3">Class 3</option>
            <option value="2">Class 2</option>
            <option value="1">Class 1</option>
          </select>
        </div>
        <div class="field full">
          <label for="studentNameInput">Student Name</label>
          <input type="text" id="studentNameInput" placeholder="Enter Student Name" autocomplete="off" />
        </div>
      </div>

      <div id="statusBox" class="status-box"></div>

      <div class="game-grid">
        <button type="button" class="game-btn" onclick="launchGame('M05', 'M05.html')">
          <span>Game M05 • Measurements</span>
          <small>Length &amp; Weight (4.1 – 4.6)</small>
        </button>
        <button type="button" class="game-btn secondary" onclick="launchGame('Days', 'Days.html')">
          <span>Days of the Week</span>
          <small>Calendar Practice</small>
        </button>
        <button type="button" class="game-btn secondary" onclick="launchGame('Keyboard', 'Keyboard.html')">
          <span>Keyboard Skills</span>
          <small>Typing &amp; Letters</small>
        </button>
      </div>
    </section>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_YOUR_DEPLOYED_WEB_APP_URL/exec";

    function enterFullscreen() {
      const el = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (el.requestFullscreen) {
          el.requestFullscreen().catch(() => {});
        } else if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
        }
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        enterFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function updateFsIcon() {
      const btn = document.getElementById("fsToggleBtn");
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
      btn.textContent = isFs ? "[×]" : "[ ]";
    }

    document.getElementById("fsToggleBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      toggleFullscreen();
    });

    document.addEventListener("fullscreenchange", updateFsIcon);
    document.addEventListener("webkitfullscreenchange", updateFsIcon);

    // Auto-request fullscreen on first user interaction
    document.addEventListener("pointerdown", function autoFsOnce() {
      enterFullscreen();
      document.removeEventListener("pointerdown", autoFsOnce);
    }, { once: true });

    function getTodayIST() {
      const now = new Date();
      const istOffset = 5.5 * 60 * 60 * 1000;
      const ist = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + istOffset);
      return ist.toISOString().slice(0, 10);
    }

    function showStatus(msg, type) {
      const box = document.getElementById("statusBox");
      box.textContent = msg;
      box.className = "status-box " + type;
    }

    async function launchGame(gameCode, targetPage) {
      enterFullscreen();
      const emis = document.getElementById("emisInput").value.trim();
      const studentName = document.getElementById("studentNameInput").value.trim();
      const studentClass = document.getElementById("classSelect").value;

      if (!emis) {
        showStatus("Please enter Student EMIS ID.", "error");
        document.getElementById("emisInput").focus();
        return;
      }
      if (!studentName) {
        showStatus("Please enter Student Name.", "error");
        document.getElementById("studentNameInput").focus();
        return;
      }

      const today = getTodayIST();
      const localKey = `emisLock_${emis}_${gameCode}_${today}`;
      if (localStorage.getItem(localKey) === "DONE") {
        showStatus(`You have already finished today's submission of ${gameCode} game! Try again tomorrow.`, "error");
        return;
      }

      showStatus("Checking EMIS eligibility & starting game...", "info");

      try {
        if (SCRIPT_URL && !SCRIPT_URL.includes("YOUR_DEPLOYED_WEB_APP_URL")) {
          const res = await fetch(`${SCRIPT_URL}?action=checkLock&emis=${encodeURIComponent(emis)}&game=${encodeURIComponent(gameCode)}&date=${encodeURIComponent(today)}`);
          const data = await res.json();
          if (data && data.locked) {
            localStorage.setItem(localKey, "DONE");
            showStatus(data.message || `You have already finished today's submission of ${gameCode} game! Try again tomorrow.`, "error");
            return;
          }
        }
      } catch (err) {
        // Proceed if offline or script check unreachable
      }

      const params = new URLSearchParams({
        emis: emis,
        name: studentName,
        cls: studentClass,
        game: gameCode,
        level: "1",
        fs: "1"
      });

      window.location.href = `${targetPage}?${params.toString()}`;
    }

    // Restore last entered student info convenience
    window.addEventListener("DOMContentLoaded", () => {
      const savedEmis = sessionStorage.getItem("amelur_emis");
      const savedName = sessionStorage.getItem("amelur_name");
      const savedCls = sessionStorage.getItem("amelur_cls");
      if (savedEmis) document.getElementById("emisInput").value = savedEmis;
      if (savedName) document.getElementById("studentNameInput").value = savedName;
      if (savedCls) document.getElementById("classSelect").value = savedCls;
    });
  </script>
</body>
</html>
