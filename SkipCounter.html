<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Skip Counting Balloon Burst - M03</title>
<style>
:root {
--header-h: 42px;
--session-h: 28px;
--objects-h: 40px;
--answers-h: 60px;
}
html, body {
height: 100%;
margin: 0;
padding: 0;
font-family: Arial, Helvetica, sans-serif;
background: linear-gradient(#87CEEB, #BEE7FF);
}

header {
display: flex;
align-items: center;
justify-content: space-between;
padding: 3px 6px;
background: #ffcc00;
box-shadow: 0 2px 6px rgba(0,0,0,0.15);
position: fixed;
top: 0; left: 0; right: 0;
z-index: 1000;
height: var(--header-h);
overflow-x: auto;
flex-wrap: nowrap;
white-space: nowrap;
gap: 6px;
}

header .left {
display: flex;
align-items: center;
gap: 8px;
}

header .left div.game-title {
font-weight: 800;
font-size: 15px;
color: #000;
padding: 4px 8px;
border: 2px solid #cc9900;
border-radius: 6px;
background: #fff6aa;
}

.user-session-pill {
font-size: 12px;
font-weight: bold;
background: #ffffff;
padding: 3px 8px;
border-radius: 6px;
border: 1px solid #b38f00;
color: #1e293b;
display: inline-flex;
gap: 6px;
align-items: center;
}

.session-strip {
position: fixed;
top: var(--header-h);
left: 0; right: 0;
height: var(--session-h);
background: #1e293b;
color: #f8fafc;
display: flex;
align-items: center;
justify-content: space-around;
font-size: 12px;
font-weight: bold;
z-index: 999;
border-bottom: 1px solid #475569;
}
.session-strip span strong {
color: #facc15;
}

header .right {
display: flex;
align-items: center;
gap: 5px;
flex-wrap: nowrap;
}

header .right div,
header select,
header button,
header label {
font-size: 12px;
font-weight: bold;
padding: 2px 5px;
border-radius: 5px;
border: 1px solid #b38f00;
background: #fff8d9;
color: #000;
box-shadow: 0 1px 2px rgba(0,0,0,0.1);
}

header button.button {
background: #ff6600;
color: #fff;
border: 1px solid #cc5200;
}
header button.button:hover { background: #ff3300; }
header button.btn-green { background: #22c55e; color: #fff; border: 1px solid #16a34a; }
header button.btn-green:hover { background: #16a34a; }

header select:hover,
header button:hover {
filter: brightness(0.95);
}

header .score-time {
display: flex;
align-items: center;
gap: 4px;
font-size: 12px;
font-weight: bold;
color: #000;
}

header .score-time div {
border: none;
background: none;
padding: 0;
font-size: 12px;
font-weight: bold;
color: #000;
}

#answersTable {
position: fixed;
top: calc(var(--header-h) + var(--session-h) + 6px);
left: 6px;
right: 6px;
background: #fff8cc;
border-collapse: collapse;
text-align: center;
font-weight: 700;
font-size: 18px;
z-index: 998;
}
#answersTable th, #answersTable td {
border: 1px solid #ccc;
padding: 3px 6px;
min-width: 22px;
}
#answersTable td.qn-id { font-weight: bold; width: 70px; background: #fff2b2; }
#answersTable td.correct { background: #66ff66; color: #000; }
#answersTable td.wrong { background: #ffcc99; color: #000; }
#answersTable td.tts-highlight { background: #ffd54f !important; color: #000 !important; transition: background .18s; }
#objectsRow td { padding: 2px; font-size: 13px; }
.dimmed { opacity: 0.3; transition: opacity 0.2s; }

#gameWrap {
position: absolute;
left: 0; right: 0;
top: calc(var(--header-h) + var(--session-h) + var(--objects-h) + var(--answers-h) + 10px);
bottom: 0;
overflow: hidden;
}
canvas { display: block; width: 100%; height: 100%; background: transparent; touch-action: none; }

#scoreMessage {
position: fixed;
top: 0; left: 0;
width: 100%; height: 100%;
display: none;
background: rgba(0,0,0,0.6);
align-items: center;
justify-content: center;
z-index: 2000;
}
#scoreMessage .box {
background: #fff;
border-radius: 20px;
padding: 30px 40px;
text-align: center;
font-size: 22px;
font-weight: bold;
box-shadow: 0 0 20px rgba(0,0,0,0.5);
max-width: 380px;
}
#scoreMessage button {
margin-top: 15px;
background: #22c55e;
color: white;
border: none;
border-radius: 10px;
padding: 8px 18px;
font-size: 16px;
cursor: pointer;
}
#scoreMessage button:hover { background: #16a34a; }
</style>
</head>
<body>

<header>
<div class="left">
<div class="game-title">M03: Skip Counter</div>
<div class="user-session-pill">
    <span>ID: <strong id="displayStudentId" style="color:#2563eb;">---</strong></span>
    <span>Name: <strong id="displayName" style="color:#059669;">---</strong></span>
    <span>Trial: <strong id="displayTrial" style="color:#d97706;">1 of 3</strong></span>
</div>
</div>

<div class="right">
<div>P_Time: <span id="pageTimer">00:00</span></div>
<button class="button" id="fullscreenBtn" title="Fullscreen">⛶</button>

<select id="skipValue">
<option value="" disabled selected>Table:</option>
</select>

<button class="button" id="resetBtn" title="Reset">⟳</button>

<select id="hideColsSelect">
<option value="" disabled selected>Hide:</option>
<option value="none">None</option>
<option value="0-4">0–4</option>
<option value="0-9">0–9</option>
<option value="0-14">0–14</option>
</select>

<button class="button" id="startBtn">▶️ Start</button>
<button class="button btn-green" id="submitBtn" onclick="submitData()" disabled>📤 Submit</button>

<div class="score-time">
<div>Score: <span id="score">0</span>/21 | Time: <span id="timer">00:00</span></div>
</div>
</div>
</header>

<div class="session-strip">
    <span>Trial 1: <strong id="t1Strip">--</strong></span>
    <span>Trial 2: <strong id="t2Strip">--</strong></span>
    <span>Trial 3: <strong id="t3Strip">--</strong></span>
    <span>Session Total: <strong id="totalStrip" style="color:#4ade80;">0/0 (0%)</strong></span>
</div>

<table id="answersTable">
<tr id="qnRow"><td class="qn-id">Qn. No.</td></tr>
<tr id="objectsRow"><td>Tiny Objects</td></tr>
<tr id="ansRow"><td>Answers:</td></tr>
</table>

<div id="gameWrap"><canvas id="gameCanvas"></canvas></div>

<div id="scoreMessage">
<div class="box">
<div id="scoreText"></div>
<button id="okBtn">OK &amp; Save Trial</button>
</div>
</div>

<script>
"use strict";

const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydKddCA-uZwXlnt9yvRMS6HgFwSXgT3RiphSojuQ3PyERaURSBhjCh-bFdHX54Hf0x/exec";

let currentStudentId = "1B01";
let currentUserName = "Student";
let currentTrialNum = 1;
const MAX_TRIALS = 3;
let currentGameCode = "M03";
let sessionTrials = [];

window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    if(params.get("studentId")) currentStudentId = params.get("studentId");
    if(params.get("name")) currentUserName = params.get("name");
    if(params.get("gameCode")) currentGameCode = params.get("gameCode");

    currentTrialNum = 1;
    document.getElementById("displayStudentId").textContent = currentStudentId;
    document.getElementById("displayName").textContent = currentUserName;
    document.getElementById("displayTrial").textContent = `${currentTrialNum} of ${MAX_TRIALS}`;

    const k = document.getElementById('skipValue');
    const optSel = document.createElement('option'); optSel.value=''; optSel.textContent='Select Table'; k.appendChild(optSel);
    for(let i=1; i<=20; i++){ let o = document.createElement('option'); o.value=i; o.textContent=i; k.appendChild(o); }
});

function updateSessionStrip() {
    let cumScore = 0;
    let cumTotal = 0;
    let cumSecs = 0;

    for (let i = 1; i <= MAX_TRIALS; i++) {
        const tData = sessionTrials[i - 1];
        const el = document.getElementById(`t${i}Strip`);
        if (tData) {
            el.textContent = `${tData.scoreStr} (${tData.timeStr})`;
            cumScore += tData.score;
            cumTotal += tData.totalQ;
            cumSecs += tData.secs;
        } else {
            el.textContent = "--";
        }
    }

    const pct = cumTotal > 0 ? Math.round((cumScore / cumTotal) * 100) : 0;
    document.getElementById("totalStrip").textContent = `${cumScore}/${cumTotal}-${pct}% | ${formatSecondsToHHMMSS(cumSecs)}`;
}

const popSoundURL = "https://cdn.pixabay.com/download/audio/2025/09/09/audio_8b2fec1f50.mp3";
const clapSoundURL = "https://cdn.pixabay.com/download/audio/2022/03/15/audio_d82921d2f0.mp3?filename=applause-75314.mp3";
function playPopSound(cb){ const a=new Audio(popSoundURL); a.volume=1; if(cb) a.onended=cb; a.play().catch(()=>{ if(cb) cb(); }); }
function playClapSound(){ const a=new Audio(clapSoundURL); a.volume=1; a.play().catch(()=>{}); }

const qnRow = document.getElementById('qnRow'),
ansRow = document.getElementById('ansRow'),
objectsRow = document.getElementById('objectsRow');

for(let i=0; i<=20; i++){
    const q = document.createElement('td'); q.textContent = i; qnRow.appendChild(q);
    const o = document.createElement('td'); o.textContent = ''; objectsRow.appendChild(o);
    const a = document.createElement('td'); a.textContent = ''; ansRow.appendChild(a);
}

const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
let DPR = window.devicePixelRatio || 1;
function resizeCanvas(){ const w = document.getElementById('gameWrap'); canvas.width = w.clientWidth * DPR; canvas.height = w.clientHeight * DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize', resizeCanvas); resizeCanvas();

let pageStart = Date.now();
setInterval(()=>{ const s = Math.floor((Date.now()-pageStart)/1000); document.getElementById('pageTimer').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; },1000);

let balloons=[], gameActive=false, spawnTimer=null, startTime=null;
let sequence=[], seqIndex=0, score=0, gameFruit="🥭";
let elapsedSeconds = 0;
const BALLOON_SPAWN_MS=900, BALLOON_MIN_SPEED=1.5, BALLOON_MAX_SPEED=3.0;

const hideColsSelect = document.getElementById('hideColsSelect');
let firstVisibleCellIndex = 1;
let firstVisibleSeqIndex = 0;

function parseRangeValue(val){
    if(val === 'none') return -1;
    const parts = val.split('-').map(x=>parseInt(x,10));
    if(parts.length===2 && !isNaN(parts[1])) return parts[1];
    return -1;
}
function computeFirstVisibleIndices(){
    const maxAnswer = parseRangeValue(hideColsSelect.value);
    if(maxAnswer >= 0){
        firstVisibleCellIndex = Math.min(ansRow.cells.length-1, maxAnswer + 2);
        if(firstVisibleCellIndex < 1) firstVisibleCellIndex = 1;
    } else {
        firstVisibleCellIndex = 1;
    }
    firstVisibleSeqIndex = firstVisibleCellIndex - 1;
}

class Balloon{
    constructor(x,y,num,color,speed,isTarget){
        this.x=x; this.y=y; this.number=num; this.color=color; this.speed=speed; this.isTarget=isTarget;
        this.radius=32+String(num).length*5;
        this.fontSize=Math.max(12,26-(String(num).length-1)*3);
        this.isHovered=false;
    }
    draw(ctx){
        ctx.save();
        ctx.beginPath();
        ctx.fillStyle=this.color;
        ctx.ellipse(this.x,this.y,this.radius,this.radius,0,0,Math.PI*2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle='#000';
        ctx.font=`bold ${this.fontSize}px Arial`;
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.fillText(this.number,this.x,this.y);
        ctx.restore();
    }
    update(){ if(!this.isHovered) this.y-=this.speed; }
}
function randomColor(){ const c=['#ff6666','#66cc66','#66ccff','#ffcc66','#cc66ff','#ff99cc']; return c[Math.floor(Math.random()*c.length)]; }
function buildSequence(){ const s=0; const k=parseInt(document.getElementById('skipValue').value)||1; const a=[]; let n=s; while(a.length<21){ a.push(n); n+=k; } return a; }

function spawnBalloon(){
    if(!gameActive) return;
    const w=canvas.clientWidth,h=canvas.clientHeight;
    const x=Math.random()*(w-100)+50, y=h+40;
    const correct=sequence[seqIndex];
    if(correct===undefined) return;
    const digits=String(correct).length;
    let d=[];
    if(seqIndex>0)d.push(sequence[seqIndex-1]);
    if(seqIndex<sequence.length-1)d.push(sequence[seqIndex+1]);
    while(d.length<5){
        let r=(digits===1)?Math.floor(Math.random()*10):(digits===2)?Math.floor(Math.random()*90)+10:Math.floor(Math.random()*900)+100;
        if(!d.includes(r)&&r!==correct) d.push(r);
    }
    const num=[correct,...d][Math.floor(Math.random()*6)];
    balloons.push(new Balloon(x,y,num,randomColor(),BALLOON_MIN_SPEED+Math.random()*(BALLOON_MAX_SPEED-BALLOON_MIN_SPEED),num===correct));
}

function animate(){
    if(!gameActive) return;
    ctx.clearRect(0,0,canvas.width/DPR,canvas.height/DPR);
    for(let i=balloons.length-1;i>=0;i--){
        const b=balloons[i];
        b.update();
        b.draw(ctx);
        if(b.y<-80) balloons.splice(i,1);
    }
    requestAnimationFrame(animate);
}

function getPos(e){
    const r=canvas.getBoundingClientRect();
    let x=(typeof e.clientX==='number')?e.clientX:(e.touches&&e.touches[0]&&e.touches[0].clientX)||0;
    let y=(typeof e.clientY==='number')?e.clientY:(e.touches&&e.touches[0]&&e.touches[0].clientY)||0;
    return {x:x-r.left,y:y-r.top};
}
function hit(p,b){ const dx=p.x-b.x, dy=p.y-b.y; return dx*dx+dy*dy<b.radius*b.radius; }

function findNextVisibleEmptyCell(fromCellIndex = firstVisibleCellIndex){
    for(let i = fromCellIndex; i < ansRow.cells.length; i++){
        const cell = ansRow.cells[i];
        if(!cell) continue;
        if(cell.style.display === 'none') continue;
        if(cell.textContent.trim() === '') return i;
    }
    return -1;
}

function placeTinyObjectsBySeq(seqIdx){
    const step=parseInt(document.getElementById('skipValue').value)||1;
    const brightCellIndex = seqIdx + 1;
    const nextCellIndex = brightCellIndex + 1;
    if(seqIdx === 0){
        if(objectsRow.cells[nextCellIndex]){
            objectsRow.cells[nextCellIndex].textContent = gameFruit.repeat(step);
            objectsRow.cells[nextCellIndex].classList.add('dimmed');
        }
        return;
    }
    if(objectsRow.cells[brightCellIndex]){
        objectsRow.cells[brightCellIndex].textContent = gameFruit.repeat(step);
        objectsRow.cells[brightCellIndex].classList.remove('dimmed');
    }
    if(objectsRow.cells[nextCellIndex]){
        objectsRow.cells[nextCellIndex].textContent = gameFruit.repeat(step);
        objectsRow.cells[nextCellIndex].classList.add('dimmed');
    }
}

let gameTimerInt = null;

function startTimer() {
    startTime = Date.now();
    if (gameTimerInt) clearInterval(gameTimerInt);
    gameTimerInt = setInterval(() => {
        elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById("timer").textContent =
            `${String(Math.floor(elapsedSeconds / 60)).padStart(2, '0')}:${String(elapsedSeconds % 60).padStart(2, '0')}`;
    }, 1000);
}

function stopGame() {
    gameActive = false;
    if (spawnTimer) clearInterval(spawnTimer);
    if (gameTimerInt) clearInterval(gameTimerInt);
}

function processClick(x, y) {
    for (let i = balloons.length - 1; i >= 0; i--) {
        const b = balloons[i];
        if (hit({ x, y }, b)) {
            if (!startTime) { startTimer(); }

            const nextCell = findNextVisibleEmptyCell(firstVisibleCellIndex);
            if (nextCell === -1) return;

            const expected = sequence[nextCell - 1];
            ansRow.cells[nextCell].textContent = expected;
            placeTinyObjectsBySeq(nextCell - 1);

            if (b.number === expected) {
                qnRow.cells[nextCell].className = 'correct';
                score++;
            } else {
                qnRow.cells[nextCell].className = 'wrong';
            }

            playPopSound();
            balloons.splice(i, 1);

            const upcomingCell = findNextVisibleEmptyCell(firstVisibleCellIndex);
            if (upcomingCell !== -1) {
                seqIndex = upcomingCell - 1;
                spawnBalloon();
            } else {
                stopGame();
                showFinalMessage();
                playClapSound();
            }

            document.getElementById("score").textContent = score;
            break;
        }
    }
}

function showFinalMessage(){
    const totalQuestions = ansRow.cells.length - firstVisibleCellIndex; 
    const percent = Math.round((score / totalQuestions) * 100);
    document.getElementById('scoreText').innerHTML = (percent >= 80) ? 
        `🎉 Trial ${currentTrialNum} of ${MAX_TRIALS} Complete!<br>Score: ${score}/${totalQuestions} (${percent}%)` : 
        `Trial ${currentTrialNum} of ${MAX_TRIALS} Complete!<br>Score: ${score}/${totalQuestions} (${percent}%)`;
    document.getElementById('scoreMessage').style.display = 'flex';
    document.getElementById('submitBtn').disabled = false;
}

document.getElementById('okBtn').addEventListener('click', () => {
    document.getElementById('scoreMessage').style.display = 'none';
    submitData();
});

function startGame(){
    computeFirstVisibleIndices();
    if(firstVisibleSeqIndex > 20){
        alert('No visible answer columns available.');
        return;
    }

    stopGame();
    sequence = buildSequence();
    seqIndex = firstVisibleSeqIndex;
    balloons = [];
    score = 0;
    elapsedSeconds = 0;
    startTime = null;

    const fruits=["🍎","🍌","🍊","🍐","🍓","🍍","🥭","🥝"]; 
    gameFruit = fruits[Math.floor(Math.random()*fruits.length)];
    document.getElementById('score').textContent = '0';
    ansRow.querySelectorAll('td').forEach((c,i)=>{ if(i>0) c.textContent=''; });
    objectsRow.querySelectorAll('td').forEach((c,i)=>{ if(i>0) { c.textContent=''; c.classList.remove('dimmed'); } });
    qnRow.querySelectorAll('td').forEach((c,i)=>{ if(i>0) c.className=''; });

    document.getElementById('submitBtn').disabled = false;
    gameActive = true;
    animate();
    startTimer();

    if(seqIndex >= 0 && seqIndex <= 20) placeTinyObjectsBySeq(seqIndex);

    for(let i=0; i<8; i++) spawnBalloon();
    spawnTimer = setInterval(spawnBalloon, BALLOON_SPAWN_MS);
}

function resetGame(){ 
    stopGame(); 
    balloons=[]; 
    seqIndex=0; 
    sequence=[]; 
    score=0; 
    elapsedSeconds=0;
    startTime=null;
    document.getElementById('score').textContent='0';
    ansRow.querySelectorAll('td').forEach((c,i)=>{ if(i>0)c.textContent=''; });
    objectsRow.querySelectorAll('td').forEach((c,i)=>{ if(i>0)c.textContent=''; c.classList.remove('dimmed'); });
    qnRow.querySelectorAll('td').forEach((c,i)=>{ if(i>0)c.className=''; });
    document.getElementById('timer').textContent='00:00';
    document.getElementById('scoreMessage').style.display='none';
    document.getElementById('submitBtn').disabled = true;
    ctx.clearRect(0, 0, canvas.width / DPR, canvas.height / DPR);
}

document.getElementById('startBtn').addEventListener('click',()=>{
    const v = document.getElementById('skipValue').value;
    if(!v){ alert('Please select step size.'); return; }
    updateHiddenColumns();
    startGame();
});
document.getElementById('resetBtn').addEventListener('click', resetGame);
document.getElementById('fullscreenBtn').addEventListener('click',()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(console.log); else document.exitFullscreen(); });

canvas.addEventListener('pointermove', e => { if(!gameActive) return; const p = getPos(e); for(const b of balloons) b.isHovered = hit(p, b); });
canvas.addEventListener('pointerleave', () => { for(const b of balloons) b.isHovered = false; });
canvas.addEventListener('pointerdown', e => { if(!gameActive) return; try{ e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId); }catch(err){} const p=getPos(e); processClick(p.x,p.y); e.preventDefault(); });

function updateHiddenColumns(){
    computeFirstVisibleIndices();
    const rows = [qnRow, objectsRow, ansRow];
    const maxAnswer = parseRangeValue(hideColsSelect.value);
    const endCellIndex = (maxAnswer >= 0) ? (maxAnswer + 1) : 0;

    rows.forEach(row => {
        if(row.cells[0]) row.cells[0].style.display = '';
        for(let i=1; i<row.cells.length; i++){
            const cell = row.cells[i];
            if(!cell) continue;
            if(endCellIndex > 0 && i <= endCellIndex) cell.style.display = 'none';
            else cell.style.display = '';
        }
    });

    if(gameActive){
        const nextVisibleEmpty = findNextVisibleEmptyCell(firstVisibleCellIndex);
        if(nextVisibleEmpty === -1){
            stopGame();
            alert('No visible answer columns remain.');
        } else {
            seqIndex = nextVisibleEmpty - 1;
            placeTinyObjectsBySeq(seqIndex);
        }
    }
}
hideColsSelect.addEventListener('change', updateHiddenColumns);
updateHiddenColumns();

function formatSecondsToHHMMSS(totalSecs) {
    if (isNaN(totalSecs) || totalSecs <= 0) return "00:00:00";
    const hrs = String(Math.floor(totalSecs / 3600)).padStart(2, "0");
    const mins = String(Math.floor((totalSecs % 3600) / 60)).padStart(2, "0");
    const secs = String(Math.floor(totalSecs % 60)).padStart(2, "0");
    return `${hrs}:${mins}:${secs}`;
}

function submitData() {
    stopGame();
    const totalQuestions = ansRow.cells.length - firstVisibleCellIndex;
    const percentage = Math.round((score / totalQuestions) * 100);
    const scoreStr = `${score}/${totalQuestions}-${percentage}%`;
    const timeStr = formatSecondsToHHMMSS(elapsedSeconds);

    sessionTrials[currentTrialNum - 1] = {
        score: score,
        totalQ: totalQuestions,
        scoreStr: scoreStr,
        secs: elapsedSeconds,
        timeStr: timeStr
    };
    updateSessionStrip();

    document.getElementById('submitBtn').disabled = true;
    document.getElementById('submitBtn').innerText = "Submitting...";

    const params = new URLSearchParams();
    params.append("action", "saveGameData");
    params.append("gameCode", currentGameCode);
    params.append("studentID", currentStudentId);
    params.append("studentId", currentStudentId);
    params.append("name", currentUserName);
    params.append("level1Score", scoreStr);
    params.append("level1Time", timeStr);
    params.append("level2Score", `0/0-0%`);
    params.append("level2Time", "00:00:00");
    params.append("score", scoreStr);
    params.append("trialId", String(currentTrialNum));

    fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: params.toString()
    }).then(() => {
        handlePostTrialFlow(scoreStr, timeStr);
    }).catch(() => {
        handlePostTrialFlow(scoreStr, timeStr);
    });
}

function handlePostTrialFlow(scoreStr, timeStr) {
    document.getElementById('submitBtn').innerText = "📤 Submit";

    if (currentTrialNum < MAX_TRIALS) {
        const remaining = MAX_TRIALS - currentTrialNum;
        alert(`Trial ${currentTrialNum} of ${MAX_TRIALS} Saved!\nScore: ${scoreStr} | Time: ${timeStr}\n\nYou have ${remaining} trial(s) remaining. Select a table and click Start for Trial ${currentTrialNum + 1}.`);
        currentTrialNum++;
        document.getElementById("displayTrial").textContent = `${currentTrialNum} of ${MAX_TRIALS}`;
        resetGame();
    } else {
        const totalScore = sessionTrials.reduce((acc, t) => acc + (t ? t.score : 0), 0);
        const totalPossible = sessionTrials.reduce((acc, t) => acc + (t ? t.totalQ : 0), 0);
        const totalSecs = sessionTrials.reduce((acc, t) => acc + (t ? t.secs : 0), 0);
        const totalPct = totalPossible > 0 ? Math.round((totalScore / totalPossible) * 100) : 0;
        const cumulativeScoreStr = `${totalScore}/${totalPossible}-${totalPct}%`;
        const cumulativeTimeStr = formatSecondsToHHMMSS(totalSecs);

        const summaryParams = new URLSearchParams();
        summaryParams.append("action", "saveSessionSummary");
        summaryParams.append("gameCode", currentGameCode);
        summaryParams.append("studentId", currentStudentId);
        summaryParams.append("name", currentUserName);
        summaryParams.append("t1Score", sessionTrials[0] ? sessionTrials[0].scoreStr : "0/21-0%");
        summaryParams.append("t1Time", sessionTrials[0] ? sessionTrials[0].timeStr : "00:00:00");
        summaryParams.append("t2Score", sessionTrials[1] ? sessionTrials[1].scoreStr : "0/21-0%");
        summaryParams.append("t2Time", sessionTrials[1] ? sessionTrials[1].timeStr : "00:00:00");
        summaryParams.append("t3Score", sessionTrials[2] ? sessionTrials[2].scoreStr : "0/21-0%");
        summaryParams.append("t3Time", sessionTrials[2] ? sessionTrials[2].timeStr : "00:00:00");
        summaryParams.append("totalScore", cumulativeScoreStr);
        summaryParams.append("totalTime", cumulativeTimeStr);

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: summaryParams.toString()
        }).finally(() => {
            alert(
                `All 3 Trials Completed for ${currentUserName} (${currentStudentId})!\n\n` +
                `Trial 1: ${sessionTrials[0].scoreStr} (${sessionTrials[0].timeStr})\n` +
                `Trial 2: ${sessionTrials[1].scoreStr} (${sessionTrials[1].timeStr})\n` +
                `Trial 3: ${sessionTrials[2].scoreStr} (${sessionTrials[2].timeStr})\n` +
                `Total Score: ${cumulativeScoreStr} | Total Time: ${cumulativeTimeStr}\n\n` +
                `Returning to Homepage...`
            );
            window.location.href = "index.html";
        });
    }
}
</script>
</body>
</html>
